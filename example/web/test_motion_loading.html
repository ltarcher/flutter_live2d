<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D 动作加载测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #canvas-container {
            width: 800px;
            height: 600px;
            margin: 20px auto;
            border: 2px solid #333;
            background-color: #fff;
            position: relative;
        }
        #live2d-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #log {
            width: 800px;
            height: 400px;
            margin: 20px auto;
            border: 1px solid #ccc;
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: auto;
        }
        #controls {
            text-align: center;
            margin: 20px;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Live2D 动作加载测试</h1>
    
    <div id="canvas-container">
        <canvas id="live2d-canvas" width="800" height="600"></canvas>
    </div>
    
    <div id="controls">
        <button onclick="loadModel()">加载模型</button>
        <button onclick="startRandomMotion()">播放随机动作</button>
        <button onclick="clearLog()">清空日志</button>
    </div>
    
    <div id="log"></div>

    <!-- 加载 Live2D 核心库 -->
    <script src="live2dcubismcore.min.js"></script>
    <script src="live2dcubismframework.js"></script>
    <script src="live2d_bridge.js"></script>
    
    <script>
        // 重定向 console.log 到页面
        const logDiv = document.getElementById('log');
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            logDiv.innerHTML += '<div style="color: #0f0;">[LOG] ' + args.join(' ') + '</div>';
            logDiv.scrollTop = logDiv.scrollHeight;
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            logDiv.innerHTML += '<div style="color: #ff0;">[WARN] ' + args.join(' ') + '</div>';
            logDiv.scrollTop = logDiv.scrollHeight;
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            logDiv.innerHTML += '<div style="color: #f00;">[ERROR] ' + args.join(' ') + '</div>';
            logDiv.scrollTop = logDiv.scrollHeight;
        };
        
        function clearLog() {
            logDiv.innerHTML = '';
        }
        
        async function loadModel() {
            try {
                console.log('开始初始化 Live2D...');
                await initLive2D();
                
                console.log('开始加载模型...');
                // 使用相对路径加载模型
                await loadModel('../assets/live2d/Wanko/Wanko.model3.json');
                
                console.log('模型加载完成');
                setupTouchEventListeners();
            } catch (error) {
                console.error('模型加载失败:', error);
            }
        }
        
        function startRandomMotion() {
            const motionGroups = Object.keys(motions);
            console.log('可用的动作组:', motionGroups);
            
            if (motionGroups.length > 0) {
                const randomGroup = motionGroups[Math.floor(Math.random() * motionGroups.length)];
                const groupMotions = motions[randomGroup];
                
                if (groupMotions && groupMotions.length > 0) {
                    const randomIndex = Math.floor(Math.random() * groupMotions.length);
                    console.log(`播放动作: ${randomGroup}[${randomIndex}]`);
                    startMotion(randomGroup, randomIndex);
                } else {
                    console.warn(`动作组 ${randomGroup} 中没有可用的动作`);
                }
            } else {
                console.warn('没有可用的动作组');
            }
        }
        
        // 页面加载完成后自动初始化
        window.addEventListener('load', function() {
            console.log('页面加载完成，准备加载 Live2D...');
        });
    </script>
</body>
</html>
